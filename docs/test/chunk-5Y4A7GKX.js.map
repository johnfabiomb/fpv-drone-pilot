<!-- Hero -->
<div class="provider-hero" [style.background]="'linear-gradient(135deg, ' + accentColor + '1a 0%, ' + accentColor + '08 100%)'">
  <div class="provider-hero__badge" [style.background]="accentColor + '1a'" [style.color]="accentColor">
    {{ categoryLabel }}
  </div>
  <div class="provider-hero__main">
    <app-provider-avatar [provider]="provider" [size]="68"></app-provider-avatar>
    <div>
      <h2 class="provider-hero__name">{{ provider.name }}</h2>
      <p class="provider-hero__tagline">{{ provider.tagline }}</p>
    </div>
  </div>
</div>

<!-- Image gallery (only rendered when provider has images) -->
<app-image-gallery
  *ngIf="provider.images?.length"
  [src]="provider.images!">
</app-image-gallery>

<!-- Description -->
<div class="provider-desc" [innerHTML]="provider.description"></div>

<!-- Highlights -->
<ul class="provider-highlights" *ngIf="provider.highlights?.length">
  <li class="highlight-item" *ngFor="let h of provider.highlights">
    <svg class="highlight-check" width="14" height="14" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    {{ h }}
  </li>
</ul>

<!-- Discount box -->
<app-deal-box
  *ngIf="provider.discount"
  [discount]="provider.discount"
  (couponCopied)="couponCopied.emit()">
</app-deal-box>

<!-- Contact links -->
<div class="provider-links">
  <a *ngIf="provider.instagram"
    [href]="'https://instagram.com/' + provider.instagram!.replace('@', '')"
    target="_blank" rel="noopener"
    class="provider-link provider-link--ig">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
    </svg>
    {{ provider.instagram }}
  </a>

  <a *ngIf="provider.phone"
    [href]="'tel:' + provider.phone" class="provider-link provider-link--phone">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.4 2 2 0 0 1 3.6 1.21h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 8.91a16 16 0 0 0 6.06 6.06l1.06-1.06a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
    </svg>
    {{ provider.phone }}
  </a>
</div>

<!-- Actions row -->
<div class="provider-actions">
  <app-share-btn [url]="shareUrl" [shareTitle]="provider.name" label="Share"
    (shared)="providerShared.emit()"></app-share-btn>
  <button class="provider-action-btn" (click)="browseDeals()">
    <i class="fa fa-tag"></i> Browse Deals
  </button>
</div>

<!-- Book now -->
<button *ngIf="provider.website" class="book-btn" (click)="openWebsite()">
  Book Now
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
  </svg>
</button>
