<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Explore Malta</title>
  <script>
    // GitHub Pages serves this for paths that don't have a prerendered file.
    // Preserve the full path + search + HASH so Angular can handle it client-side.
    // The hash matters for OAuth / magic-link callbacks (e.g. /bookings#access_token=…):
    // it's URL-ENCODED into ?redirect= so (1) it isn't dropped, and (2) there's no real
    // "#access_token" on "/", so the map app's Supabase client can't consume a token that
    // belongs to the bookings project. map-root then navigates to the decoded target
    // (fragment intact) where the correct Supabase client reads it.
    (function () {
      var l = window.location;
      var dest = encodeURIComponent(l.pathname + l.search + l.hash);
      l.replace(l.origin + '/?redirect=' + dest);
    })();
  </script>
</head>
<body></body>
</html>
