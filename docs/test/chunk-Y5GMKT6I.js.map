<app-panel-shell
  title="Notifications"
  (closeRequested)="router.navigate(['/malta'])"
  (dragStart)="bridge.panel.onDragStart($event)"
  (dragMove)="bridge.panel.onDragMove($event)"
  (dragEnd)="bridge.panel.onDragEnd($event)"
  (bodyDragStart)="bridge.panel.startDrag($event)"
  (bodyDragMove)="bridge.panel.onDragMove($event)"
  (bodyDragEnd)="bridge.panel.onDragEnd($event)">

  <div class="nf-content">

    <!-- Header row with mark-all button -->
    <div class="nf-topbar" *ngIf="notifService.unreadCount() > 0">
      <span class="nf-topbar__count">{{ notifService.unreadCount() }} unread</span>
      <button class="nf-topbar__all" (click)="notifService.markAllRead()">Mark all read</button>
    </div>

    <!-- Loading skeleton -->
    <div class="nf-skeleton-list" *ngIf="!notifService.loaded()">
      <div class="nf-skeleton" *ngFor="let i of [1,2,3]"></div>
    </div>

    <!-- Empty state -->
    <div class="nf-empty" *ngIf="notifService.loaded() && !notifService.notifications().length">
      <svg class="nf-empty__icon" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <p class="nf-empty__msg">No notifications yet</p>
      <p class="nf-empty__sub">We'll notify you about level-ups, new spots and exclusive deals.</p>
    </div>

    <!-- Notification list -->
    <div class="nf-list" *ngIf="notifService.notifications().length">
      <div
        class="nf-item"
        [class.nf-item--unread]="!notif.is_read"
        [class.nf-item--clickable]="!!notif.action_url"
        *ngFor="let notif of notifService.notifications()"
        (click)="onNotifClick(notif)">

        <div class="nf-item__icon">{{ icons[notif.type] }}</div>

        <div class="nf-item__body">
          <div class="nf-item__header">
            <span class="nf-item__title">{{ notif.title }}</span>
            <span class="nf-item__time">{{ timeAgo(notif.created_at) }}</span>
          </div>
          <div class="nf-item__text" *ngIf="notif.body" [innerHTML]="notif.body"></div>
          <button class="nf-item__action" *ngIf="notif.action_url && notif.action_label">
            {{ notif.action_label }} →
          </button>
        </div>

        <div class="nf-item__dot" *ngIf="!notif.is_read"></div>

      </div>
    </div>

  </div>

</app-panel-shell>
