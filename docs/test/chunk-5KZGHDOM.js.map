<app-panel-shell
  [title]="panelTitle"
  [minimized]="bridge.panel.minimized()"
  (closeRequested)="onPanelCloseRequested()"
  (dragStart)="bridge.panel.onDragStart($event)"
  (dragMove)="bridge.panel.onDragMove($event)"
  (dragEnd)="bridge.panel.onDragEnd($event)"
  (toggleCollapse)="bridge.toggleMinimize()">

  <app-share-btn
    panelActions
    [url]="currentShareUrl"
    [shareTitle]="panelTitle">
  </app-share-btn>

  <app-location-detail
    *ngIf="!selectedProvider"
    [location]="selectedLocation"
    [userLat]="userLat"
    [userLon]="userLon"
    (close)="closePanel()"
    (explore)="exploreMap()"
    (navRequested)="onNavRequested($event)"
    (providerSelected)="openProvider($event)">
  </app-location-detail>

  <app-provider-detail
    *ngIf="selectedProvider"
    [provider]="selectedProvider"
    (navRequested)="onNavRequested($event)">
  </app-provider-detail>

</app-panel-shell>
