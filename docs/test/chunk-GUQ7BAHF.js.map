<div class="discount-box" *ngIf="isValid">
  <div class="discount-box__header">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
      <line x1="7" y1="7" x2="7.01" y2="7"/>
    </svg>
    <span class="discount-box__label">{{ discount.label }}</span>
  </div>

  <!-- Logged in: tap to copy -->
  <button *ngIf="authService.isLoggedIn()" class="discount-box__coupon" (click)="copyCoupon()">
    <span class="coupon-code">{{ discount.coupon }}</span>
    <span class="coupon-copy-hint" [class.copied]="isCouponCopied">
      <svg *ngIf="!isCouponCopied" width="13" height="13" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
      {{ isCouponCopied ? '✓ Copied!' : 'Tap to copy' }}
    </span>
  </button>

  <!-- Not logged in: blurred code + sign-in CTA -->
  <button *ngIf="!authService.isLoggedIn()" class="discount-box__coupon discount-box__coupon--locked" (click)="authService.openLoginModal()">
    <span class="coupon-code coupon-code--blurred">XXXXXXXX</span>
    <span class="coupon-unlock-hint">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      Sign in to reveal
    </span>
  </button>

  <div class="discount-box__reveal" [class.discount-box__reveal--locked]="!authService.isLoggedIn()">
    <p class="discount-box__instructions">{{ discount.instructions }}</p>
    <div class="discount-box__expiry" *ngIf="expiry">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
      Valid until {{ expiry }}
    </div>
  </div>
</div>
