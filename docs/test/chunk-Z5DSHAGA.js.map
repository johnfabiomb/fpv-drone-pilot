<div class="success-page">
  <div class="success-inner">

    <div class="check-wrap">
      <svg class="check-icon" viewBox="0 0 52 52" fill="none">
        <circle class="check-circle" cx="26" cy="26" r="25" stroke="#F4A922" stroke-width="2"/>
        <path class="check-mark" d="M14 26l9 9 15-17" stroke="#F4A922" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1 class="success-title">Payment received!</h1>
    <p class="success-sub">
      Share your confirmation and book your slot<br>to complete the process.
    </p>

    <div class="receipt-card">
      <div class="receipt-row">
        <span class="receipt-label">Status</span>
        <span class="status-badge">
          <span class="status-dot"></span>
          Paid
        </span>
      </div>
      <div class="receipt-divider"></div>
      <div class="receipt-row">
        <span class="receipt-label">Date</span>
        <span class="receipt-value">{{ paidAt | date:'d MMM y · HH:mm' }}</span>
      </div>
      <div class="receipt-divider"></div>
      <div class="receipt-row receipt-row--ref" (click)="copyRef()" title="Tap to copy">
        <span class="receipt-label">Reference</span>
        <div class="ref-copy">
          <span class="receipt-ref">{{ sessionId ?? '—' }}</span>
          <span class="copy-hint">{{ copied ? '✓ Copied' : 'tap to copy' }}</span>
        </div>
      </div>
    </div>

    <div class="calendar-wrap">
      <div #calendarBtn></div>
    </div>

    <div class="divider-or">
      <span>also share your confirmation</span>
    </div>

    <button class="share-btn" (click)="shareConfirmation()" [disabled]="sharing">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
      </svg>
      {{ sharing ? 'Preparing…' : 'Share confirmation' }}
    </button>

    <a class="back-link" href="/pay">← Back to payment page</a>

  </div>
</div>
