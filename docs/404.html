<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Explore Malta</title>
  <script>
    // GitHub Pages serves this for any unknown path.
    // Instantly redirect /malta  →  /#/malta  so the hash-based
    // Angular SPA can handle the route without a round-trip XHR.
    (function () {
      var l = window.location;
      var path = l.pathname.replace(/\/$/, '') || '/';
      l.replace(l.origin + '/#' + path + l.search + l.hash);
    })();
  </script>
</head>
<body></body>
</html>
