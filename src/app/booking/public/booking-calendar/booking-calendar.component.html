<div class="book">
  <header class="book__head">
    <button class="book__back" (click)="backToServices()">‹ Services</button>
    <h1 class="book__title">{{ serviceName() || 'Book a session' }}</h1>
    <p class="book__sub">Pick a day, then select your start and end time.</p>
  </header>

  <!-- Calendar + hour slots (shared presentational component) -->
  <app-availability-calendar
    dayLabel="1 · Choose a day"
    timeLabel="2 · Select your time"
    [timeHint]="'tap start, then end · up to ' + maxHours() + 'h'"
    emptyText="No times available on this day."
    [monthLabel]="monthLabel()"
    [canGoPrev]="canGoPrev()"
    [cells]="cells()"
    [selectedDate]="selectedDate()"
    [loading]="loading()"
    [error]="error()"
    [slots]="slots()"
    [hasSelection]="rangeStart() !== null"
    (prevMonth)="changeMonth(-1)"
    (nextMonth)="changeMonth(1)"
    (daySelected)="selectDay($event)"
    (slotSelected)="selectHour($event)"
    (clearSelection)="clearRange()">
  </app-availability-calendar>

  <!-- Sticky summary -->
  @if (selection(); as sel) {
    <section class="summary">
      <div class="summary__info">
        <div class="summary__when">{{ sel.from }} – {{ sel.to }}</div>
        <div class="summary__dur">{{ sel.hours }}h session</div>
      </div>
      @if (sel.price !== null && sel.valid) {
        <div class="summary__price">{{ currencySymbol() }}{{ sel.price }}</div>
        <button class="summary__cta" (click)="continueToBook()">Continue</button>
      } @else {
        <div class="summary__noprice">Minimum {{ minHours() }}h</div>
      }
    </section>
  }
</div>
