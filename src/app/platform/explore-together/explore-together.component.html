<app-panel-shell
  title="Explore Together"
  (closeRequested)="router.navigate(['/malta'])"
  (dragStart)="bridge.panel.onDragStart($event)"
  (dragMove)="bridge.panel.onDragMove($event)"
  (dragEnd)="bridge.panel.onDragEnd($event)"
  (bodyDragStart)="bridge.panel.startDrag($event)"
  (bodyDragMove)="bridge.panel.onDragMove($event)"
  (bodyDragEnd)="bridge.panel.onDragEnd($event)">

  <div class="et-content">

    <!-- Admin-only: one-time migration -->
    <div *ngIf="userDataService.isAdmin()" class="et-migration">
      <button class="et-migration__btn" (click)="runMigration()" [disabled]="migrating()">
        {{ migrating() ? 'Updating…' : '🔧 Fix groups data' }}
      </button>
      <span *ngIf="migrateResult()" class="et-migration__result">{{ migrateResult() }}</span>
    </div>

    <app-groups-section></app-groups-section>

  </div>

</app-panel-shell>
