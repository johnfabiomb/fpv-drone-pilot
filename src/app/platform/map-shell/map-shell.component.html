<app-nav-interstitial
  *ngIf="bridge.pendingNavUrl()"
  [url]="bridge.pendingNavUrl()!"
  [duration]="bridge.interstitialProvider() ? 0 : bridge.navDuration()"
  [buttonLabel]="bridge.interstitialProvider() ? 'Book Now' : 'Open Google Maps'"
  [openNewTab]="true"
  [showGuestNudge]="!bridge.interstitialProvider() && !auth.isLoggedIn()"
  (signInRequested)="auth.openLoginModal()"
  (closed)="onInterstitialClosed()">

  <!-- Book Now mode: show coupon reminder -->
  <div slot-top *ngIf="bridge.interstitialProvider()">
    <app-coupon-reminder [provider]="bridge.interstitialProvider()!"></app-coupon-reminder>
  </div>

  <!-- Ads mode: nearby provider card (slot-top) -->
  <div slot-top *ngIf="!bridge.interstitialProvider() && bridge.interstitialProviders()[0]">
    <p *ngIf="bridge.interstitialLabel()" class="interstitial-near-label">
      {{ bridge.interstitialLabel() }}
    </p>
    <app-provider-card
      [provider]="bridge.interstitialProviders()[0]"
      (selected)="onInterstitialProviderSelected($event)">
    </app-provider-card>
  </div>

  <!-- slot-bottom: second provider card for logged-in users -->
  <app-provider-card
    *ngIf="!bridge.interstitialProvider() && bridge.interstitialProviders()[1]"
    slot-bottom
    [provider]="bridge.interstitialProviders()[1]"
    (selected)="onInterstitialProviderSelected($event)">
  </app-provider-card>

</app-nav-interstitial>

<div class="map-layout">
  <div class="map-layout__main">

    <div class="map-layout__map">
      <app-filter-bar
        *ngIf="bridge.showFilterBar()"
        (filterChange)="bridge.filters.set($event)">
      </app-filter-bar>

      <app-map
        #mapComp
        [activeFilters]="bridge.filters()"
        [providerPins]="bridge.providerPins()"
        [selectedLocation]="bridge.selectedLocation()"
        [fitPoint]="bridge.fitPoint()"
        [pickModeActive]="bridge.pickMode()"
        [meetingPointMarker]="bridge.meetingPointMarker()"
        (locationSelected)="bridge.locationSelected$.next($event)"
        (providerPinSelected)="bridge.providerPinSelected$.next($event)"
        (mapTapped)="onMapTapped()"
        (controlTapped)="onControlTapped()"
        (gpsCoord)="bridge.gpsCoord$.next($event)"
        (coordPicked)="bridge.coordPicked$.next($event)"
        (meetingPointTapped)="bridge.meetingPointClicked$.next($event)">
      </app-map>

      <button
        *ngIf="bridge.floatingBackBtn()"
        class="floating-back-btn"
        [class.floating-back-btn--accent]="bridge.floatingBackBtn()!.accent"
        (click)="bridge.floatingBackBtnClicked$.next()">
        <i class="fa fa-chevron-left"></i>
        {{ bridge.floatingBackBtn()!.label }}
      </button>

      <div class="floating-pick-hint" *ngIf="bridge.pickMode()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
        </svg>
        Tap the map to place the meeting point
      </div>

      <button
        *ngIf="bridge.panelOpen() && bridge.mapOnly()"
        class="show-panel-btn"
        [class.show-panel-btn--primary]="isDeals()"
        (click)="bridge.openPanel()">
        <i class="fa" [ngClass]="showPanelBtnIcon()"></i>
      </button>

      <div class="floating-route-tabs" *ngIf="hasMultipleRoutes()">
        <button
          class="route-tab"
          [class.active]="bridge.activeRouteIndex() === -1"
          (click)="onSelectAllRoutes()">
          All
        </button>
        <button
          *ngFor="let r of routes(); let i = index"
          class="route-tab"
          [class.active]="bridge.activeRouteIndex() === i"
          [style.--tab-active-color]="routeColors[i]"
          (click)="onSelectRoute(i)">
          <span *ngIf="r.emoji">{{ r.emoji }}&nbsp;</span>{{ r.label }}
        </button>
      </div>

      <div class="offline-pill" *ngIf="!isOnline">
        <span class="offline-dot"></span> Offline — cached map active
      </div>

      <!-- Developer info button — floats below zoom controls -->
      <div class="dev-about-wrap">
        <div class="dev-popup" *ngIf="showDevAbout" (click)="$event.stopPropagation()">
          <img class="dev-popup__photo" src="/assets/images/profile.webp" alt="John Montaño">
          <div class="dev-popup__name">John Montaño</div>
          <div class="dev-popup__tags">
            <span>FPV Drone Pilot</span>
            <span>Content Creator</span>
            <span>Software Developer</span>
            <span>Malta</span>
          </div>
          <div class="dev-popup__divider"></div>
          <div class="dev-popup__links">
            <a routerLink="/about" (click)="showDevAbout = false">About</a>
            <a routerLink="/privacy" (click)="showDevAbout = false">Privacy Policy</a>
            <a routerLink="/cookies" (click)="showDevAbout = false">Cookie Policy</a>
            <a routerLink="/contact" (click)="showDevAbout = false">Contact</a>
          </div>
          <div class="dev-popup__contact">
            <a href="mailto:creator&#64;johnfabiomb.com">creator&#64;johnfabiomb.com</a>
          </div>
          <div class="dev-popup__socials">
            <a class="dev-popup__social" href="https://www.instagram.com/johnfabiomb/" target="_blank" rel="noopener">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
              &#64;johnfabiomb
            </a>
            <a class="dev-popup__social" href="https://www.facebook.com/johnfabiomb/" target="_blank" rel="noopener">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
              John Montaño
            </a>
            <a class="dev-popup__social" href="https://www.tiktok.com/@johnfabiomb" target="_blank" rel="noopener">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.78 1.52V6.75a4.85 4.85 0 0 1-1.01-.06z"/></svg>
              &#64;johnfabiomb
            </a>
          </div>
          <div class="dev-popup__version">v{{ version }}</div>
        </div>
        <button class="dev-about-btn" (click)="toggleDevAbout($event)">
          <img src="/assets/images/profile.webp" alt="About" width="28" height="28">
        </button>
      </div>

    </div>

    <!-- Panel is always in the DOM so the router-outlet (and its child component)
         stay alive when panel is hidden. Visibility is controlled by CSS only. -->
    <div
      class="map-layout__panel"
      #panelWrap
      [class.panel--hidden]="!bridge.panelOpen() || bridge.mapOnly()">
      <button
        class="collapse-btn"
        *ngIf="bridge.panelOpen() && !bridge.mapOnly()"
        (click)="bridge.mapOnly.set(true)"
        title="Fullscreen map">
        <i class="fa fa-chevron-right"></i>
      </button>
      <router-outlet />
    </div>

  </div>
  <app-footer />
</div>
