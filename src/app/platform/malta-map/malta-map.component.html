<div class="app">
  <div class="main-area">
    <div class="map-wrap">
      <app-filter-bar *ngIf="!selectedLocation && !backTo" (filterChange)="activeFilters = $event"></app-filter-bar>

      <app-map
        *ngIf="map"
        [activeFilters]="activeFilters"
        (locationSelected)="onLocationSelected($event)"
        (mapTapped)="onMapTapped()"
        (gpsCoord)="onGpsUpdate($event)">
      </app-map>

      <button
        *ngIf="selectedLocation && !mapOnly && !backTo"
        class="floating-back-btn"
        (click)="panelComp.requestClose()">
        <i class="fa fa-chevron-left"></i> Back to map
      </button>

      <button
        *ngIf="backTo"
        class="floating-back-btn floating-back-btn--trend"
        (click)="goBack()">
        <i class="fa fa-chevron-left"></i>
        {{ backTo === '30-places-2026' ? 'Back to list' : 'Back' }}
      </button>

      <button
        *ngIf="selectedLocation && mapOnly"
        class="show-panel-btn"
        (click)="mapOnly = false"
        title="Show details">
        <i class="fa fa-info-circle"></i>
      </button>

      <div class="offline-pill" *ngIf="!isOnline">
        <span class="offline-dot"></span> Offline — cached map active
      </div>
    </div>

    <div
      #panelWrap
      class="location-panel-wrap"
      *ngIf="selectedLocation && !mapOnly">

      <button class="collapse-btn" (click)="mapOnly = true" title="Fullscreen map">
        <i class="fa fa-chevron-right"></i>
      </button>

      <app-location-panel
        [location]="selectedLocation"
        [minimized]="panelMinimized"
        [userLat]="userLat"
        [userLon]="userLon"
        (close)="closePanel()"
        (explore)="exploreMap()"
        (headerDragStart)="onDragStart($event)"
        (headerDragMove)="onDragMove($event)"
        (headerDragEnd)="onDragEnd($event)"
        (toggleCollapse)="panelMinimized ? expandPanel() : minimizePanel()">
      </app-location-panel>
    </div>
  </div>

  <app-footer></app-footer>
</div>
