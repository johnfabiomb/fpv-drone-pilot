<app-nav-interstitial
  *ngIf="pendingNavUrl"
  [url]="pendingNavUrl"
  [duration]="navDuration"
  [providers]="interstitialProviders"
  (providerSelected)="openProvider($event); pendingNavUrl = null"
  (closed)="pendingNavUrl = null">
</app-nav-interstitial>

<div class="app">
  <div class="main-area">
    <div class="map-wrap">
      <app-filter-bar *ngIf="!selectedLocation && !backTo" (filterChange)="activeFilters = $event"></app-filter-bar>

      <app-map
        *ngIf="map"
        [activeFilters]="activeFilters"
        [selectedLocation]="selectedLocation"
        (locationSelected)="onLocationSelected($event)"
        (mapTapped)="onMapTapped()"
        (gpsCoord)="onGpsUpdate($event)">
      </app-map>

      <button
        *ngIf="(selectedLocation || selectedProvider) && !mapOnly && !backTo"
        class="floating-back-btn"
        (click)="onPanelCloseRequested()">
        <i class="fa fa-chevron-left"></i>
        {{ selectedProvider ? (selectedLocation?.title ?? 'Back to map') : 'Back to map' }}
      </button>

      <button
        *ngIf="backTo"
        class="floating-back-btn floating-back-btn--trend"
        (click)="goBack()">
        <i class="fa fa-chevron-left"></i>
        {{ backTo === '30-places-2026' ? 'Back to list' : 'Back' }}
      </button>

      <button
        *ngIf="(selectedLocation || selectedProvider) && mapOnly"
        class="show-panel-btn"
        (click)="mapOnly = false"
        title="Show details">
        <i class="fa fa-info-circle"></i>
      </button>

      <div class="offline-pill" *ngIf="!isOnline">
        <span class="offline-dot"></span> Offline — cached map active
      </div>
    </div>

    <div
      #panelWrap
      class="location-panel-wrap"
      *ngIf="(selectedLocation || selectedProvider) && !mapOnly">

      <button class="collapse-btn" (click)="mapOnly = true" title="Fullscreen map">
        <i class="fa fa-chevron-right"></i>
      </button>

      <app-panel-shell
        [title]="panelTitle"
        [minimized]="panelMinimized"
        (closeRequested)="onPanelCloseRequested()"
        (dragStart)="onDragStart($event)"
        (dragMove)="onDragMove($event)"
        (dragEnd)="onDragEnd($event)"
        (toggleCollapse)="panelMinimized ? expandPanel() : minimizePanel()">

        <app-share-btn
          panelActions
          [url]="currentShareUrl"
          [shareTitle]="panelTitle">
        </app-share-btn>

        <app-location-detail
          *ngIf="!selectedProvider"
          [location]="selectedLocation"
          [userLat]="userLat"
          [userLon]="userLon"
          (close)="closePanel()"
          (explore)="exploreMap()"
          (navRequested)="onNavRequested($event)"
          (providerSelected)="openProvider($event)">
        </app-location-detail>

        <app-provider-detail
          *ngIf="selectedProvider"
          [provider]="selectedProvider"
          (navRequested)="onNavRequested($event)">
        </app-provider-detail>

      </app-panel-shell>
    </div>
  </div>

  <app-footer></app-footer>
</div>
