<div class="pay-page">
  <div class="pay-inner">

    <div class="brand-monogram">JM</div>
    <div class="brand-text">
      <div class="brand-name">&#64;Johnfabiomb</div>
      <div class="brand-title">FPV Drone Pilot · Content Creator</div>
    </div>

    <div class="brand-divider"></div>

    <div class="amount-banner" *ngIf="amount !== null">
      <span class="amount-label">Amount to pay</span>
      <span class="amount-value">{{ formattedAmount }}</span>
    </div>

    <p class="brand-copy" *ngIf="amount === null">
      Thank you for working with me.<br>
      Complete your payment securely below<br>
      and book your slot once done.
    </p>

    <ul class="brand-steps" *ngIf="amount === null">
      <li>
        <span class="step-num">1</span>
        <span>Enter the amount</span>
      </li>
      <li>
        <span class="step-num">2</span>
        <span>Click <strong>Pay</strong> and pay securely</span>
      </li>
      <li>
        <span class="step-num">3</span>
        <span>Book your slot</span>
      </li>
    </ul>

    <button class="pay-btn" (click)="pay()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
        <line x1="1" y1="10" x2="23" y2="10"/>
      </svg>
      {{ payLabel }}
    </button>

    <div class="brand-secure">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
      </svg>
      256-bit SSL · Secured by Stripe
    </div>

  </div>
</div>
