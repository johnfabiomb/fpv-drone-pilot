<div class="overlay" (click)="dismiss()">
  <div class="card" (click)="$event.stopPropagation()">

    <div class="card-header">
      <button class="dismiss-btn" (click)="dismiss()" aria-label="Close">✕</button>
    </div>

    <!-- Top slot: projected by the caller (coupon reminder or provider card ad) -->
    <div class="slot-wrap">
      <ng-content select="[slot-top]"></ng-content>
    </div>

    <div class="countdown-wrap" *ngIf="duration > 0">
      <svg class="ring" viewBox="0 0 60 60" width="60" height="60">
        <circle class="ring-bg" cx="30" cy="30" [attr.r]="26"/>
        <circle
          class="ring-fill"
          cx="30" cy="30"
          [attr.r]="26"
          [style.stroke-dasharray]="circumference"
          [style.stroke-dashoffset]="dashOffset"/>
      </svg>
      <span class="countdown-num">{{ seconds }}</span>
    </div>

    <p class="countdown-label" *ngIf="duration > 0">
      {{ seconds > 0 ? 'Opening in ' + seconds + 's…' : 'Ready!' }}
    </p>

    <!-- Bottom slot: optional second provider card ad -->
    <div class="slot-wrap">
      <ng-content select="[slot-bottom]"></ng-content>
    </div>

    <button
      class="open-btn"
      [class.ready]="seconds === 0"
      [disabled]="seconds > 0"
      (click)="open()">
      {{ buttonLabel }}
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="7" y1="17" x2="17" y2="7"/>
        <polyline points="7 7 17 7 17 17"/>
      </svg>
    </button>

  </div>
</div>
