<div id="ol-map" class="map-container"></div>
<ng-container *ngFor="let item of locations" style="overflow: hidden;display: flex; height: inherit;" >
    <img
      ngOptimizedImage
      (click)="clickon(item)"
      id="{{item.id}}"
      [src]="item.img"
      [class.marker-dot]="markerMode === 'dot'"
      [class.marker-image]="markerMode === 'image'"
      [style.width.px]="markerSize"
      [style.height.px]="markerSize"
      style="border-radius: 10px; cursor: pointer; object-fit: cover; transition: width 0.2s ease, height 0.2s ease, border-radius 0.2s ease;"
      width="80px"
      height="80px"
      alt=""
      srcset="">
    <!-- <img (click)="clickon(item)"  id="{{item.img}}" [src]="item.img" style=" border-radius: 50%; clip-path: polygon(0 0, 50% 100%, 100% 0); cursor: pointer;" width="80px" height="80px" alt="" srcset=""> -->
</ng-container>
