<div class="gallery">

  <div class="stack"
    (touchstart)="onTouchStart($event)"
    (touchend)="onTouchEnd($event)"
  >
    <div
      *ngFor="let img of stackImages; let i = index"
      class="card"
      [class.is-active]="i === active"
      [attr.data-offset]="circularOffset(i)"
      (click)="goTo(i)"
    >
      <div class="skeleton" [class.hidden]="isLoaded(img)"></div>
      <img [src]="img" alt="" [class.loaded]="isLoaded(img)" (load)="markLoaded(img)" />
    </div>

    <div class="nav nav--left"  *ngIf="canNavigate" (click)="prev()"></div>
    <div class="nav nav--right" *ngIf="canNavigate" (click)="next()"></div>
  </div>

  <!-- one dot per real image -->
  <div class="dots">
    <span
      *ngFor="let img of images; let i = index"
      class="dot"
      [class.active]="i === active"
      (click)="goTo(i)"
    ></span>
  </div>

</div>

<!-- Lightbox — teleported to document.body at runtime to escape iOS overflow clipping -->
<ng-template #lightboxTpl>
  <div class="lightbox"
    (click)="closeLightbox()"
    (touchstart)="onLightboxTouchStart($event)"
    (touchend)="onLightboxTouchEnd($event)">

    <button class="lightbox__close" (click)="closeLightbox()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>

    <div class="lightbox__stage" (click)="$event.stopPropagation()">
      <img class="lightbox__img"
        [src]="images[lightboxIndex]"
        [style.transform]="'scale(' + lightboxScale + ')'"
        alt=""
        draggable="false" />
    </div>

    <button *ngIf="images.length > 1" class="lightbox__nav lightbox__nav--prev" (click)="lightboxPrev(); $event.stopPropagation()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <button *ngIf="images.length > 1" class="lightbox__nav lightbox__nav--next" (click)="lightboxNext(); $event.stopPropagation()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>

    <div class="lightbox__controls" (click)="$event.stopPropagation()">
      <button class="lightbox__zoom-btn" (click)="zoomOut()" [disabled]="lightboxScale <= 1">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/>
        </svg>
      </button>
      <span class="lightbox__zoom-label">{{ (lightboxScale * 100).toFixed(0) }}%</span>
      <button class="lightbox__zoom-btn" (click)="zoomIn()" [disabled]="lightboxScale >= 4">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/>
        </svg>
      </button>
    </div>

    <div class="lightbox__counter" *ngIf="images.length > 1">{{ lightboxIndex + 1 }} / {{ images.length }}</div>
  </div>
</ng-template>
