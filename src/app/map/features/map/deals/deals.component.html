<app-panel-shell
  title="Local Deals"
  (closeRequested)="onPanelCloseRequested()"
  (dragStart)="bridge.panel.onDragStart($event)"
  (dragMove)="bridge.panel.onDragMove($event)"
  (dragEnd)="bridge.panel.onDragEnd($event)"
  (bodyDragStart)="bridge.panel.startDrag($event)"
  (bodyDragMove)="bridge.panel.onDragMove($event)"
  (bodyDragEnd)="bridge.panel.onDragEnd($event)">

  <div class="deals-list">
    <div class="deals-intro">
      <p class="deals-intro__text">Hand-picked experiences from local partners I've personally connected with — tap a card or a map pin to grab the offer.</p>
    </div>
    <app-experience-card
      *ngFor="let e of sortedExperiences()"
      [experience]="e.experience"
      [provider]="e.provider"
      (selected)="openExperience($event)">
    </app-experience-card>
  </div>

</app-panel-shell>
