<div class="provider-card" (click)="selected.emit(provider)">
  <div class="provider-card__stripe" [style.background]="accentColor"></div>

  <div class="provider-card__body">

    <!-- Provider identity -->
    <div class="provider-card__header">

      <app-provider-avatar [provider]="provider" [size]="46"></app-provider-avatar>

      <div class="provider-card__info">
        <span class="provider-card__name">{{ provider.name }}</span>
        <span class="provider-card__tagline">{{ provider.tagline }}</span>
      </div>
      <span class="provider-card__exclusive-badge" [style.background]="accentColor">Partner deal</span>
    </div>

    <!-- Deal strip -->
    <div class="provider-card__deal" [style.background]="accentColor">

      <div class="provider-card__pct">
        <span class="pct-num">{{ discountPct }}</span>
        <span class="pct-off">OFF</span>
      </div>

      <div class="provider-card__deal-text">
        <span class="deal-what">{{ discountWhat }}</span>
        <span class="deal-exclusive">Only when booked via this guide</span>
      </div>

      <span class="provider-card__cta">
        Claim
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
        </svg>
      </span>
    </div>

  </div>
</div>
