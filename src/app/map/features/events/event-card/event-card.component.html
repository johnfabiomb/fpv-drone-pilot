<div class="event-card" (click)="selected.emit(event)">
  <div class="event-card__media">
    <img class="event-card__img" [src]="event.image" [alt]="event.name" loading="lazy">
    <span class="event-card__cat" [style.background]="meta.color">{{ meta.icon }} {{ meta.label }}</span>
  </div>

  <div class="event-card__body">
    <div class="event-card__when">
      {{ whenLabel }}
      <span class="event-card__more" *ngIf="extraDates">+{{ extraDates }} more {{ extraDates === 1 ? 'date' : 'dates' }}</span>
    </div>
    <div class="event-card__name">{{ event.name }}</div>
    <div class="event-card__venue" *ngIf="event.venue">
      <i class="fa-solid fa-location-dot"></i> {{ event.venue }}
    </div>

    <button class="event-card__cta" (click)="openTickets($event)">
      Get tickets
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
      </svg>
    </button>
  </div>
</div>
