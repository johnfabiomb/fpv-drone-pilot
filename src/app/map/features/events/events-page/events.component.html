<app-panel-shell
  title="What's On in Malta"
  (closeRequested)="onPanelCloseRequested()"
  (dragStart)="bridge.panel.onDragStart($event)"
  (dragMove)="bridge.panel.onDragMove($event)"
  (dragEnd)="bridge.panel.onDragEnd($event)"
  (bodyDragStart)="bridge.panel.startDrag($event)"
  (bodyDragMove)="bridge.panel.onDragMove($event)"
  (bodyDragEnd)="bridge.panel.onDragEnd($event)">

  <div class="events">
    <!-- Compact filters: three small dropdowns -->
    <div class="events__filters">
      <select class="events__select" aria-label="When" (change)="setPeriod($any($event.target).value)">
        <option *ngFor="let p of periodFilters" [value]="p.id" [selected]="activePeriod() === p.id">{{ p.label }}</option>
      </select>
      <select class="events__select" aria-label="Day" (change)="setDay($any($event.target).value)">
        <option *ngFor="let d of dayFilters" [value]="d.id" [selected]="activeDay() === d.id">{{ d.label }}</option>
      </select>
      <select class="events__select" aria-label="Type" (change)="setCategory($any($event.target).value)">
        <option *ngFor="let c of categoryFilters" [value]="c.id" [selected]="activeCategory() === c.id">{{ c.id === 'all' ? 'All types' : c.label }}</option>
      </select>
    </div>

    <!-- Venue filter active -->
    <div class="events__venue-filter" *ngIf="selectedVenue() as v">
      <span><i class="fa-solid fa-location-dot"></i> {{ v }}</span>
      <button (click)="clearVenue()">Clear ✕</button>
    </div>

    <div class="events__count">{{ filtered().length }} event{{ filtered().length === 1 ? '' : 's' }}</div>

    <div class="events__list">
      <app-event-card
        *ngFor="let e of filtered()"
        [event]="e"
        [now]="now"
        (selected)="openEvent($event)">
      </app-event-card>

      <div class="events__empty" *ngIf="filtered().length === 0">
        No events match these filters — try “All dates”.
      </div>
    </div>
  </div>

</app-panel-shell>
