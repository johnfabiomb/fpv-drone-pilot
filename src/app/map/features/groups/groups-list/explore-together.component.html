<app-panel-shell
  title="Explore Together"
  (closeRequested)="router.navigate(['/malta'])"
  (dragStart)="bridge.panel.onDragStart($event)"
  (dragMove)="bridge.panel.onDragMove($event)"
  (dragEnd)="bridge.panel.onDragEnd($event)"
  (bodyDragStart)="bridge.panel.startDrag($event)"
  (bodyDragMove)="bridge.panel.onDragMove($event)"
  (bodyDragEnd)="bridge.panel.onDragEnd($event)">

  <div class="et-content">

    @if (groupsUnlocked()) {
      <app-groups-section></app-groups-section>
    } @else {
      <div class="et-locked">
        <div class="et-locked__icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </div>
        <h3 class="et-locked__title">Explore Together</h3>
        <p class="et-locked__sub">Coming Soon</p>
        <p class="et-locked__desc">Find other explorers and join hikes at Malta's best spots. Stay tuned!</p>
      </div>
    }

  </div>

</app-panel-shell>
