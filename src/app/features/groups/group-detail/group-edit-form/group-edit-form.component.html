<div class="gd-edit-form">
  <div class="gd-edit-form__header">
    <h3 class="gd-edit-form__title">Edit group</h3>
    <button class="gd-edit-form__close" (click)="cancel()" aria-label="Cancel">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="gd-edit-form__field">
    <label>Title</label>
    <input type="text" [(ngModel)]="editTitle" placeholder="Group title" maxlength="80">
  </div>

  <div class="gd-edit-form__field">
    <label>Location <span class="gd-edit-form__opt">(optional)</span></label>
    <div class="gd-edit-form__spot-wrap">
      <input type="text" [(ngModel)]="editSpotSearch" (input)="onSpotInput()"
        placeholder="Search a location…" autocomplete="off">
      <ul class="gd-edit-form__spot-results" *ngIf="editSpotResults().length">
        <li *ngFor="let s of editSpotResults()" (click)="selectSpot(s)">{{ s.title }}</li>
      </ul>
    </div>
    <span class="gd-edit-form__spot-selected" *ngIf="editSpotSlug">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      {{ editSpotTitle }}
    </span>
  </div>

  <div class="gd-edit-form__row">
    <div class="gd-edit-form__field">
      <label>Date</label>
      <input type="date" [(ngModel)]="editDate">
    </div>
    <div class="gd-edit-form__field">
      <label>Time</label>
      <input type="time" [(ngModel)]="editTime">
    </div>
  </div>

  <div class="gd-edit-form__field">
    <label>Difficulty</label>
    <div class="gd-edit-form__chips">
      <span class="chip" [class.active]="editDifficulty === 'easy'"     (click)="editDifficulty = 'easy'">Easy</span>
      <span class="chip" [class.active]="editDifficulty === 'moderate'" (click)="editDifficulty = 'moderate'">Moderate</span>
      <span class="chip" [class.active]="editDifficulty === 'hard'"     (click)="editDifficulty = 'hard'">Hard</span>
    </div>
  </div>

  <div class="gd-edit-form__field">
    <label>Description <span class="gd-edit-form__opt">(optional)</span></label>
    <textarea [(ngModel)]="editDescription" rows="3" maxlength="400"
      placeholder="What's the plan? Anything to know beforehand?"></textarea>
  </div>

  <div class="gd-edit-form__field">
    <label>Max members <span class="gd-edit-form__opt">(optional)</span></label>
    <input type="number" [(ngModel)]="editMaxMembers" min="2" max="50" placeholder="Unlimited">
  </div>

  <div class="gd-edit-form__field">
    <label>
      Tour price <span class="gd-edit-form__opt">(optional)</span>
      <span *ngIf="!canSetPrice()" class="gd-edit-form__lock-hint">🔒 Guide or admin only</span>
    </label>
    <div class="gd-price-wrap">
      <span class="gd-price-euro">€</span>
      <input type="number" [(ngModel)]="editPrice" min="0" step="0.01" placeholder="Free"
        [disabled]="!canSetPrice()">
    </div>
  </div>

  <div class="gd-edit-form__field">
    <label>Meeting point <span class="gd-edit-form__opt">(optional)</span></label>

    <div *ngIf="editPendingMeetingPoint()" class="gd-meeting-confirm">
      <span class="gd-meeting-confirm__msg">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
        </svg>
        Is this the right spot?
      </span>
      <div class="gd-meeting-confirm__actions">
        <button class="gd-meeting-confirm__retry" (click)="retryPoint()">Try again</button>
        <button class="gd-meeting-confirm__ok" (click)="confirmPendingPoint()">Confirm</button>
      </div>
    </div>

    <div *ngIf="!editMeetingPoint && !editPendingMeetingPoint()" class="gd-meeting-pick">
      <button class="gd-meeting-pick__btn" (click)="startPickingPoint()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
        </svg>
        Pin on map
      </button>
    </div>

    <div *ngIf="editMeetingPoint && !editPendingMeetingPoint()" class="gd-meeting-set">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      Meeting point set
      <button class="gd-meeting-set__remove" (click)="clearMeetingPoint()">Remove</button>
    </div>
  </div>

  <p class="gd-edit-form__error" *ngIf="editError()">{{ editError() }}</p>

  <div class="gd-edit-form__actions">
    <button class="gd-edit-form__cancel" (click)="cancel()">Cancel</button>
    <button class="gd-edit-form__submit" (click)="submit()" [disabled]="editBusy()">
      {{ editBusy() ? 'Saving…' : 'Save changes' }}
    </button>
  </div>
</div>
