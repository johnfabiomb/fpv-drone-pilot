<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Explore Malta</title>
  <script>
    // GitHub Pages serves this for paths that don't have a prerendered file.
    // Preserve the full path+search so Angular router can handle it client-side.
    (function () {
      var l = window.location;
      var path = encodeURIComponent(l.pathname + l.search);
      l.replace(l.origin + '/?redirect=' + path);
    })();
  </script>
</head>
<body></body>
</html>
